<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>姓名中的信仰密码</title>
    <!-- 引入 html-to-image 库，用于导出海报 -->
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #8B0000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .container {
            width: 375px;
            height: 667px;
            background: #8B0000;
            position: relative;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            text-align: center;
            padding: 30px 20px;
            transition: opacity 0.5s;
        }

        .page.active { display: flex; }

        /* ---------- 封面 ---------- */
        .cover-logo {
            width: 180px; height: 180px;
            border: 3px solid #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: rotateSlow 20s linear infinite;
            /* 可以替换为图片背景，如 background: url('images/logo.png') center/cover no-repeat; */
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
        }
        .cover-logo .inner-star {
            font-size: 60px;
            animation: pulse 2s ease-in-out infinite;
            /* 如果使用图片，可将此处替换为 <img> 或隐藏文字 */
        }
        @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .cover-title {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .cover-subtitle {
            font-size: 14px;
            color: rgba(255,215,0,0.8);
            margin-bottom: 40px;
        }
        .btn-start {
            background: #FFD700;
            color: #8B0000;
            border: none;
            padding: 14px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* ---------- 输入页 ---------- */
        .compass-small {
            width: 100px; height: 100px;
            border: 2px solid #FFD700;
            border-radius: 50%;
            margin-bottom: 30px;
            opacity: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .input-guide {
            font-size: 14px;
            color: rgba(255,215,0,0.7);
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .input-box {
            width: 200px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #FFD700;
            border-radius: 25px;
            color: #FFD700;
            font-size: 22px;
            text-align: center;
            outline: none;
            margin-bottom: 30px;
        }
        .input-box::placeholder { color: rgba(255,215,0,0.3); }
        .btn-decode {
            background: #FFD700;
            color: #8B0000;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* ---------- 解码动画 ---------- */
        .compass-anim {
            width: 150px; height: 150px;
            border: 3px solid #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 60px;
            animation: spinFast 0.5s linear 3;
        }
        @keyframes spinFast { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .decoding-text {
            font-size: 14px;
            color: rgba(255,215,0,0.7);
            margin-top: 20px;
        }

        /* ---------- 结果页 ---------- */
        .report-card {
            width: 320px;
            background: rgba(255,255,255,0.08);
            border: 2px solid #FFD700;
            border-radius: 15px;
            padding: 25px 20px;
            position: relative;
        }
        .report-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            border-bottom: 1px solid rgba(255,215,0,0.3);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .report-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .report-item .label { color: rgba(255,215,0,0.7); }
        .report-item .value { font-weight: bold; }
        .report-poem {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,215,0,0.3);
            font-size: 16px;
            line-height: 2;
            font-style: italic;
            white-space: pre-line;
        }
        .report-seal {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 60px; height: 60px;
            border: 2px solid #FF0000;
            border-radius: 50%;
            color: #FF0000;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-15deg);
            opacity: 0.8;
            /* 可替换为图片背景 */
        }
        .btn-poster {
            margin-top: 25px;
            background: #FFD700;
            color: #8B0000;
            border: none;
            padding: 12px 35px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* ---------- 海报预览页 ---------- */
        .poster-preview {
            width: 280px;
            height: 440px;
            /* 可替换为你的海报背景图： background: url('images/poster-bg.jpg') center/cover no-repeat; */
            background: linear-gradient(135deg, #8B0000, #FF0000, #8B0000);
            border: 3px solid #FFD700;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .poster-watermark {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="60" text-anchor="middle" fill="rgba(255,255,255,0.05)" font-size="40">★</text></svg>');
            pointer-events: none;
        }
        .poster-poem {
            font-size: 16px;
            line-height: 2.2;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
            z-index: 1;
            white-space: pre-line;
            text-align: center;
        }
        .poster-seal {
            margin-top: 30px;
            width: 70px; height: 70px;
            border: 3px solid #FF0000;
            border-radius: 50%;
            color: #FF0000;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-15deg);
            z-index: 1;
            /* 可替换为印章图片： background: url('images/seal.png') center/contain no-repeat; */
        }
        .btn-share {
            margin-top: 20px;
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            padding: 10px 30px;
            font-size: 14px;
            border-radius: 50px;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .btn-share:active { opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">

    <!-- 第1页：封面 -->
    <div class="page active" id="page1">
        <div class="cover-logo">
            <!-- 可以替换为 <img src="images/logo.png" style="width:100%; height:100%; border-radius:50%;"> -->
            <div class="inner-star">★</div>
        </div>
        <div class="cover-title">姓名中的信仰密码</div>
        <div class="cover-subtitle">你的名字里，藏着怎样的红色基因？</div>
        <button class="btn-start" onclick="goToPage(2)">开 启 鉴 定</button>
    </div>

    <!-- 第2页：输入页 -->
    <div class="page" id="page2">
        <div class="compass-small">★</div>
        <div class="input-guide">
            泱泱华夏，姓名是家族的血脉<br>
            也是时代的烙印<br>
            今日，不问前程，只问初心
        </div>
        <input type="text" class="input-box" id="nameInput"
               placeholder="写下你的名字" maxlength="4"
               oninput="this.value=this.value.replace(/[^\u4e00-\u9fa5]/g,'')">
        <button class="btn-decode" onclick="startDecode()">启封 · 基因鉴定</button>
    </div>

    <!-- 第3页：解码动画 -->
    <div class="page" id="page3">
        <div class="compass-anim">★</div>
        <div class="decoding-text" id="decodingText">
            正在解析姓名中的信仰序列……
        </div>
    </div>

    <!-- 第4页：结果页 -->
    <div class="page" id="page4">
        <div class="report-card">
            <div class="report-title">红色基因 · 鉴定报告</div>
            <div class="report-item">
                <span class="label">姓 名</span>
                <span class="value" id="reportName">---</span>
            </div>
            <div class="report-item">
                <span class="label">显性基因</span>
                <span class="value" id="reportAttrA">---</span>
            </div>
            <div class="report-item">
                <span class="label">隐性基因</span>
                <span class="value" id="reportAttrB">---</span>
            </div>
            <div class="report-item">
                <span class="label">基因纯度</span>
                <span class="value">100%热爱</span>
            </div>
            <div class="report-poem" id="reportPoem">---</div>
            <div class="report-item" style="margin-top:15px; font-size:12px; color:rgba(255,215,0,0.5);">
                <span>鉴定单位：红色基因研究中心</span>
                <span>2026年7月1日</span>
            </div>
            <div class="report-seal" id="reportSeal">---</div>
        </div>
        <button class="btn-poster" onclick="goToPage(5)">生成专属海报</button>
    </div>

    <!-- 第5页：海报预览（导出区域） -->
    <div class="page" id="page5">
        <!-- 这个 div 就是最终导出为图片的元素 -->
        <div class="poster-preview" id="posterExportArea">
            <div class="poster-watermark"></div>
            <div class="poster-poem" id="posterPoem">---</div>
            <div class="poster-seal" id="posterSeal">---</div>
        </div>
        <button class="btn-share" id="btnSave">保存并分享</button>
        <button class="btn-share" style="margin-top:10px;" onclick="goToPage(1)">重新鉴定</button>
    </div>

</div>

<script>
    // ============ 核心数据 ============
    const geneLib = {
        "志": { attrA:["志存高远，心怀天下","心之所向，素履以往"], attrB:["矢志不渝，笃行不怠","以志为马，不负韶华"], attrC:["逢山开路，遇水架桥"], attrD:["志向所指，即为中国方向"] },
        "勇": { attrA:["勇立潮头，敢为人先","无畏风雨，挺身向前"], attrB:["刚毅果敢，百折不挠","狭路相逢勇者胜"], attrC:["以勇为剑，披荆斩棘"], attrD:["勇者无畏，大国担当"] },
        "建": { attrA:["建功立业，实干兴邦","建设美好，从我做起"], attrB:["默默耕耘，筑梦踏实","一砖一瓦，砌成理想"], attrC:["空谈误国，实干兴邦"], attrD:["建设者，是时代的脊梁"] },
        "国": { attrA:["胸怀家国，志在四方","国之栋梁，少年意气"], attrB:["家国一体，休戚与共","赤子之心，以国为家"], attrC:["以国为家，以身许国"], attrD:["名字里，就有一份誓言"] },
        "芳": { attrA:["芬芳如兰，气韵自华","芳华正茂，朝气蓬勃"], attrB:["赠人玫瑰，手有余香","静吐芬芳，不争春色"], attrC:["以芳华，写芳华"], attrD:["遍地芳菲，皆是春晖"] },
        "华": { attrA:["风华正茂，挥斥方遒","华夏儿女，意气风发"], attrB:["朴实无华，默默耕耘","腹有诗书气自华"], attrC:["以我之华，耀国之华"], attrD:["华夏大地，有你更美"] },
        "文": { attrA:["文以载道，以文化人","文质彬彬，然后君子"], attrB:["文武兼备，内外兼修","温文尔雅，柔中有刚"], attrC:["以文为笔，书写时代"], attrD:["文明之火，代代相传"] },
        "强": { attrA:["自强不息，奋斗为本","强国有我，请党放心"], attrB:["外强中实，表里如一","温良有度，刚柔并济"], attrC:["强大自己，温暖他人"], attrD:["强国有你，未来可期"] },
        "安": { attrA:["安之若素，从容有度","安居乐业，岁月静好"], attrB:["修己安人，兼济天下","心安之处是吾乡"], attrC:["安守初心，稳步前行"], attrD:["国安，则家安"] },
        "静": { attrA:["静水流深，从容有度","静如处子，动如脱兔"], attrB:["静以修身，俭以养德","非宁静无以致远"], attrC:["静守初心，行稳致远"], attrD:["岁月静好，因有人负重"] },
        "磊": { attrA:["光明磊落，坦荡如砥","磊落不凡，气度恢宏"], attrB:["三石聚坚，初心不移","胸有磊块，化为丘壑"], attrC:["做光明磊落之人"], attrD:["磊落之志，照山河"] },
        "明": { attrA:["光明正大，明辨是非","明德惟馨，以德服人"], attrB:["自知者明，知人者智","明心见性，澄澈如镜"], attrC:["用明澈之心看世界"], attrD:["明灯一盏，照亮前路"] }
    };

    const fallbackGene = {
        attrA: ["赤诚热烈，初心如炬","朴实无华，至真至纯","平凡之中，自有光芒"],
        attrB: ["默默耕耘，静待花开","坚守本心，方得始终","不争不抢，自有力量"],
        attrC: ["一步一印，行稳致远","做好自己，温暖他人"],
        attrD: ["无名亦有名，平凡亦英雄","每一份微光，都值得被看见"]
    };

    const poemTemplates = [
        `如果名字是一粒种子，\n就把它种在春天的土壤里。\n它会开出"{attrA}"的花，\n结出"{attrB}"的果。\n我叫{全名}，这是我和这片土地的约定。`,
        `《{姓氏}氏志》\n{第一字}山{第二字}水之间，\n一片丹心在此间。\n生来有{attrA}，\n修得{attrB}。\n是为{全名}，是为信仰。`,
        `我是{全名}。\n我的青春，有{attrA}的豪迈，\n也有{attrC}的担当。\n以我之名，向党报到！`,
        `亲爱的{全名}：\n当你写下名字时，\n就写下了一份承诺。\n愿你永远保持{attrB}的初心，\n用{attrC}去丈量世界。`
    ];

    function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function decodeName(name) {
        let firstChar = name.charAt(0);
        let secondChar = name.charAt(1) || name.charAt(0);
        let thirdChar = name.charAt(2) || null;

        let gene1 = geneLib[secondChar] || fallbackGene;
        let gene2 = thirdChar ? (geneLib[thirdChar] || fallbackGene) : null;

        let attrA = pickRandom(gene1.attrA);
        let attrB = gene2 ? pickRandom(gene2.attrB) : pickRandom(gene1.attrB);
        let attrC = pickRandom(gene1.attrC);
        let attrD = gene2 ? pickRandom(gene2.attrD) : pickRandom(gene1.attrD);

        let template = pickRandom(poemTemplates);
        let surname = firstChar;
        let firstName = name.slice(1) || name;
        let firstWord = firstName.charAt(0);
        let secondWord = firstName.charAt(1) || firstWord;

        let poem = template
            .replace(/{姓氏}/g, surname)
            .replace(/{全名}/g, name)
            .replace(/{第一字}/g, firstWord)
            .replace(/{第二字}/g, secondWord)
            .replace(/{attrA}/g, attrA)
            .replace(/{attrB}/g, attrB)
            .replace(/{attrC}/g, attrC)
            .replace(/{attrD}/g, attrD);

        return { attrA, attrB, attrC, attrD, poem };
    }

    // ============ 页面切换 ============
    function goToPage(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + pageNum).classList.add('active');
    }

    // ============ 开始解码 ============
    function startDecode() {
        let nameInput = document.getElementById('nameInput');
        let name = nameInput.value.trim();

        if (!name || name.length < 2) {
            alert('请写下你的完整姓名（至少2个汉字）');
            return;
        }

        goToPage(3);

        let decodingTexts = [
            "正在解析姓名中的信仰序列……",
            "检测到红色基因，纯度极高……",
            "跨越百年的精神密码，正在解锁……"
        ];
        let textIndex = 0;
        let textInterval = setInterval(() => {
            textIndex = (textIndex + 1) % decodingTexts.length;
            document.getElementById('decodingText').textContent = decodingTexts[textIndex];
        }, 800);

        setTimeout(() => {
            clearInterval(textInterval);
            let result = decodeName(name);

            document.getElementById('reportName').textContent = name;
            document.getElementById('reportAttrA').textContent = result.attrA;
            document.getElementById('reportAttrB').textContent = result.attrB;
            document.getElementById('reportPoem').textContent = result.poem;
            document.getElementById('reportSeal').textContent = name;

            document.getElementById('posterPoem').textContent = result.poem;
            document.getElementById('posterSeal').textContent = name;

            goToPage(4);
        }, 2000);
    }

    // ============ 海报导出为图片 ============
    async function exportPoster() {
        const posterElement = document.getElementById('posterExportArea');
        const btnSave = document.getElementById('btnSave');
        
        // 导出时隐藏按钮文字，防止截到按钮（但按钮不在poster内部，无需处理）
        try {
            // 生成 PNG 图片
            const dataUrl = await htmlToImage.toPng(posterElement, {
                quality: 1,
                pixelRatio: 2  // 高清输出
            });
            
            // 触发下载
            const link = document.createElement('a');
            link.download = '我的红色基因海报.png';
            link.href = dataUrl;
            link.click();
        } catch (error) {
            console.error('导出失败:', error);
            alert('海报生成失败，请重试');
        }
    }

    // 绑定导出按钮
    document.getElementById('btnSave').addEventListener('click', exportPoster);

    // 支持回车键触发解码
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') startDecode();
    });
</script>

</body>
</html>
