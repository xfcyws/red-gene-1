<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>姓名中的信仰密码</title>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <script src="geneLib.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #8B0000;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100vh;
            background: #8B0000;
            position: relative;
            overflow: hidden;
        }
        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFD700;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s;
        }
        .page.active { display: flex; }
        .cover-poster {
            width: 85%;
            max-width: 360px;
            aspect-ratio: 7/10;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }
        .poster-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .cover-poster::after {
            content: "";
            position: absolute;
            top: -100%; left: -100%;
            width: 200%; height: 200%;
            background: linear-gradient(135deg, transparent 0%, transparent 35%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.35) 45%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.35) 55%, rgba(255,255,255,0.08) 60%, transparent 65%, transparent 100%);
            animation: sweepLight 4s ease-in-out infinite;
            z-index: 2; pointer-events: none;
        }
        @keyframes sweepLight { 0% { top: -100%; left: -100%; } 100% { top: 100%; left: 100%; } }
        .cover-title { font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin-bottom: 12px; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .cover-subtitle { font-size: 0.95rem; color: rgba(255,215,0,0.8); margin-bottom: 40px; letter-spacing: 1px; }
        .btn-start { background: linear-gradient(135deg, #FFD700, #FFA500); color: #8B0000; border: none; padding: 16px 64px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; letter-spacing: 4px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
        .btn-start:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2); }
        .compass-img { width: 100px; height: 100px; margin-bottom: 35px; opacity: 0.9; }
        .input-guide { font-size: 0.95rem; color: rgba(255,215,0,0.7); margin-bottom: 30px; line-height: 2; letter-spacing: 1px; }
        .input-box { width: 75%; max-width: 280px; height: 56px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,215,0,0.6); border-radius: 28px; color: #FFD700; font-size: 1.4rem; text-align: center; outline: none; margin-bottom: 35px; transition: border-color 0.3s, background 0.3s; }
        .input-box:focus { border-color: #FFD700; background: rgba(255,255,255,0.12); }
        .input-box::placeholder { color: rgba(255,215,0,0.3); font-size: 1.1rem; }
        .btn-decode { background: linear-gradient(135deg, #FFD700, #FFA500); color: #8B0000; border: none; padding: 14px 48px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; letter-spacing: 3px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
        .emblem-static { width: 100px; height: 100px; margin-bottom: 50px; }
        .decoding-text { font-size: 0.95rem; color: rgba(255,215,0,0.6); letter-spacing: 1px; }
        .report-card { width: 88%; max-width: 380px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,215,0,0.5); border-radius: 18px; padding: 35px 25px; position: relative; backdrop-filter: blur(2px); }
        .report-title { font-size: 1.4rem; font-weight: bold; letter-spacing: 4px; border-bottom: 1px solid rgba(255,215,0,0.2); padding-bottom: 18px; margin-bottom: 22px; }
        .report-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 0.95rem; }
        .report-item .label { color: rgba(255,215,0,0.65); letter-spacing: 1px; }
        .report-item .value { font-weight: 600; text-align: right; max-width: 60%; line-height: 1.5; }
        .report-poem { margin-top: 24px; padding-top: 24px; border-top: 1px solid rgba(255,215,0,0.2); font-size: 1.05rem; line-height: 2.2; white-space: pre-line; letter-spacing: 1px; }
        .report-seal { position: absolute; bottom: 18px; right: 18px; width: 68px; height: 68px; border: 2px solid #CC0000; border-radius: 50%; color: #CC0000; font-size: 0.95rem; font-weight: bold; display: flex; align-items: center; justify-content: center; transform: rotate(-15deg); opacity: 0.85; }
        .btn-poster { margin-top: 30px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #8B0000; border: none; padding: 14px 42px; font-size: 1.15rem; font-weight: bold; border-radius: 50px; letter-spacing: 3px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
        .poster-preview { width: 82%; max-width: 340px; aspect-ratio: 7/10; background: linear-gradient(160deg, #8B0000 0%, #B22222 40%, #8B0000 100%); border: 2px solid rgba(255,215,0,0.6); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px; position: relative; overflow: hidden; box-shadow: 0 8px 35px rgba(0,0,0,0.4); }
        .poster-watermark { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 15 L58 38 L83 38 L63 52 L71 75 L50 61 L29 75 L37 52 L17 38 L42 38 Z" fill="rgba(255,255,255,0.04)"/></svg>'); pointer-events: none; }
        .poster-poem { font-size: 1.05rem; line-height: 2.4; text-shadow: 0 0 12px rgba(255,215,0,0.25); z-index: 1; white-space: pre-line; text-align: center; letter-spacing: 1px; }
        .poster-seal { margin-top: 35px; width: 76px; height: 76px; border: 3px solid #CC0000; border-radius: 50%; color: #CC0000; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; transform: rotate(-15deg); z-index: 1; opacity: 0.9; }
        .btn-share { margin-top: 28px; background: transparent; color: #FFD700; border: 2px solid rgba(255,215,0,0.6); padding: 12px 36px; font-size: 1rem; border-radius: 50px; letter-spacing: 3px; cursor: pointer; transition: background 0.3s, border-color 0.3s; }
        .btn-share:active { background: rgba(255,215,0,0.1); border-color: #FFD700; }
        .poster-preview img { width: 100%; height: 100%; object-fit: contain; border-radius: 14px; }
    </style>
</head>
<body>
<div class="container">
    <div class="page active" id="page1">
        <div class="cover-poster"><img src="images/cover-poster.png" alt="封面" class="poster-img"></div>
        <div class="cover-title">姓名中的信仰密码</div>
        <div class="cover-subtitle">你的名字里，藏着怎样的红色基因？</div>
        <button class="btn-start" onclick="goToPage(2)">开 启 鉴 定</button>
    </div>
    <div class="page" id="page2">
        <img src="images/deco-star.png" alt="装饰" class="compass-img">
        <div class="input-guide">泱泱华夏，姓名是家族的血脉<br>也是时代的烙印<br>今日，不问前程，只问初心</div>
        <input type="text" class="input-box" id="nameInput" placeholder="写下你的名字" maxlength="4" oninput="this.value=this.value.replace(/[^\u4e00-\u9fa5]/g,'')">
        <button class="btn-decode" onclick="startDecode()">启封 · 基因鉴定</button>
    </div>
    <div class="page" id="page3">
        <img src="images/party-emblem.png" alt="党徽" class="emblem-static">
        <div class="decoding-text" id="decodingText">正在解析姓名中的信仰序列……</div>
    </div>
    <div class="page" id="page4">
        <div class="report-card">
            <div class="report-title">红色基因 · 鉴定报告</div>
            <div class="report-item"><span class="label">姓 名</span><span class="value" id="reportName">---</span></div>
            <div class="report-item"><span class="label">显性基因</span><span class="value" id="reportAttrA">---</span></div>
            <div class="report-item"><span class="label">隐性基因</span><span class="value" id="reportAttrB">---</span></div>
            <div class="report-item"><span class="label">基因纯度</span><span class="value">100%热爱</span></div>
            <div class="report-poem" id="reportPoem">---</div>
            <div class="report-item" style="margin-top:16px; font-size:0.85rem; color:rgba(255,215,0,0.45);"><span>鉴定单位：红色基因研究中心</span><span>2026年7月1日</span></div>
            <div class="report-seal" id="reportSeal">---</div>
        </div>
        <button class="btn-poster" onclick="goToPage(5)">生成专属海报</button>
    </div>
    <div class="page" id="page5">
        <div class="poster-preview" id="posterExportArea">
            <div class="poster-watermark"></div>
            <div class="poster-poem" id="posterPoem">---</div>
            <div class="poster-seal" id="posterSeal">---</div>
        </div>
        <button class="btn-share" id="btnSave">保存并分享</button>
        <button class="btn-share" style="margin-top:12px;" onclick="goToPage(1)">重新鉴定</button>
    </div>
</div>
<script>
// 兜底库
const fallbackGene = {
    attrA: ["赤诚热烈，初心如炬","朴实无华，至真至纯"],
    attrB: ["默默耕耘，静待花开","坚守本心，方得始终"],
    attrC: ["一步一印，行稳致远"],
    attrD: ["无名亦有名，平凡亦英雄"]
};

// 50套诗文模板（官媒风格）
const poemTemplates = [
    `《{姓氏}氏志》\n{第一字}山{第二字}水之间，一片丹心在此间。\n生来有{attrA}，\n修得{attrB}。\n莫问前程几许，只顾风雨兼程。\n是为{全名}，是为信仰。`,
    `{全名}·铭\n名者，命也。父母赐我以名，我以此名立志。\n愿有{attrA}之胸怀，\n亦有{attrB}之坚守。\n以此铭志，以此践行。`,
    `行香子·{全名}\n{第一字}字当头，{第二字}字为骨。\n这一生，{attrA}，{attrB}。\n不负韶华，不负时代。\n行遍山河，此心依旧。`,
    `七律·名志\n父母赐名寄此生，{第一字}心{第二字}骨两相成。\n{attrA}为底色，\n{attrB}作明灯。\n千秋家国一身系，万里山河寸心承。\n且看{全名}行处，步步生莲步步澄。`,
    `满江红·{全名}\n名中有{第一字}，当有{attrA}之气概；\n名中有{第二字}，须怀{attrB}之深情。\n壮志在胸，初心在握。\n待从头，携手新长征，朝天阙。`,
    `如果名字是一粒种子，\n就把它种在春天的土壤里。\n它会开出“{attrA}”的花，\n结出“{attrB}”的果。\n我叫{全名}，\n这是我和这片土地的约定。`,
    `亲爱的{全名}：\n你名字里的{第一字}，藏着{attrA}的底色；\n你名字里的{第二字}，写着{attrB}的注脚。\n愿你带着{attrC}去行走，\n带着{attrD}去相信。`,
    `{全名}，\n你的名字是星辰，{attrA}；\n你的名字也是大地，{attrB}。\n仰望星空时，不忘脚踏实地。\n这就是你名字的意义。`,
    `很多年前，有人写下你的名字，\n把{attrA}和{attrB}，\n一起藏进了这两个字里。\n很多年后，你读懂了它。\n{全名}，\n这是时间给你的礼物。`,
    `{全名}，你好。\n你问名字的意义？\n我想，大概是——\n以{第一字}之{attrA}，\n以{第二字}之{attrB}，\n在这个时代，写下你自己的答案。`,
    `我是{全名}。\n我的青春，有{attrA}的豪迈，\n也有{attrC}的担当。\n生逢盛世，重任在肩。\n以我之名，向党报到！\n以我之志，向未来报到！`,
    `如果有人问，你是谁？\n{全名}这样回答——\n我是{attrA}的践行者，\n是{attrB}的传承人。\n我的名字很小，但我的信仰很大。\n这就是我的回答。`,
    `{全名}，出发吧！\n带上{第一字}的{attrA}，\n带上{第二字}的{attrB}。\n前方有光，脚下有路。\n以青春之名，赴时代之约。`,
    `请以{全名}的名义起誓：\n永葆{attrA}之心，\n坚守{attrB}之志。\n百年风云，不过序章。\n新的百年，我来了！`,
    `{全名}的战歌：\n以{第一字}为旗，{attrA}；\n以{第二字}为剑，{attrB}。\n逢山开路，遇水架桥。\n这，就是我的信仰战歌！`,
    `亲爱的{全名}：\n当你写下名字时，\n就写下了一份承诺。\n愿你永远保持{attrB}的初心，\n用{attrC}去丈量世界。\n名字是父母给的，\n信仰是自己选的。\n爱你的人，于2026年7月1日。`,
    `{全名}，你好。\n我是多年后的你。\n我想告诉你——\n你名字里的{attrA}，我守住了；\n你名字里的{attrB}，我做到了。\n谢谢你的名字，让我成为今天的我。`,
    `致{全名}：\n你生来就带着{attrA}，\n也蕴藏着{attrB}。\n愿你走过千山万水，\n归来仍是少年。\n愿你与时代同行，\n不负此生。`,
    `我的名字叫{全名}。\n{第一字}是从祖辈那里继承的{attrA}，\n{第二字}是从父辈那里接过的{attrB}。\n现在，轮到我了。\n我会把这份信仰，继续传下去。`,
    `{全名}，记住——\n你有{attrA}的底色，\n也有{attrB}的力量。\n这世界很大，诱惑很多。\n但你的名字会提醒你：\n你是谁，从哪里来，要去哪里。`,
    `{全名}，你的名字里\n有{attrA}的厚度，\n更有{attrB}的温度。\n征途漫漫，惟有奋斗。`,
    `以{attrA}为笔，\n以{attrB}为墨，\n{全名}，这是你写给时代的答卷。`,
    `从{第一字}到{第二字}，\n从{attrA}到{attrB}，\n{全名}，你的名字是奋斗者的坐标。`,
    `{attrA}，是你出发的理由；\n{attrB}，是你抵达的终点。\n{全名}，你的名字就是航标。`,
    `{全名}——\n{第一字}是信仰的基石，\n{第二字}是初心的灯塔。\n征途万里，不忘初心。`,
    `有一种力量叫{attrA}，\n有一种坚守叫{attrB}。\n{全名}，这是你名字里的中国力量。`,
    `{全名}，\n你的{attrA}，是时代洪流中的一束光；\n你的{attrB}，是人间烟火里的一份暖。`,
    `{第一字}是方向，{第二字}是力量。\n{全名}，你的名字，是平凡中的不凡，\n是奋斗者的勋章。`,
    `{全名}，你的名字是{attrA}的注脚，\n也是{attrB}的答案。\n不负韶华，不负时代。`,
    `从{attrA}到{attrB}，\n{全名}，你的名字就是一座桥，\n连接着过去与未来，\n连接着小我与大我。`,
    `{全名}，当你写下名字的这一刻，\n历史在回响，未来在召唤。\n你带着{attrA}，\n也带着{attrB}。\n这是你的宣言，也是你的使命。`,
    `{全名}，\n你的名字里有前辈的{attrA}，\n也有后辈的{attrB}。\n薪火相传，生生不息。`,
    `{全名}，你听——\n时代的号角已经吹响。\n你的{attrA}，是利剑；\n你的{attrB}，是盾牌。\n出发吧，就现在。`,
    `{全名}，\n你的{attrA}，是写给历史的信；\n你的{attrB}，是留给未来的光。\n请签下你的名字，\n为这个时代作证。`,
    `{全名}，你的名字是一粒火种。\n点燃{attrA}的燎原之势，\n照亮{attrB}的前行之路。\n星星之火，可以燎原。`,
    `{第一字}之{attrA}，{第二字}之{attrB}。\n{全名}，你的名字，就是你的信仰。\n征途漫漫，奋斗以成。`,
    `{第一字}是起跑线，{第二字}是终点线。\n{全名}，你的{attrA}，就是奔跑的意义。`,
    `{全名}——\n{第一字}中有{attrA}的执着，\n{第二字}中有{attrB}的温柔。\n这是你的名字，也是你的时代。`,
    `{第一字}为经，{第二字}为纬。\n{全名}，你用{attrA}织就理想，\n用{attrB}编织人生。`,
    `{全名}，\n{第一字}是山，{attrA}；\n{第二字}是海，{attrB}。\n山海之间，是你的征途。`,
    `{全名}：{attrA}，{attrB}。\n这，就是我的信仰密码。`,
    `{全名}的红色基因：\n{attrA} + {attrB} = 100%热爱。`,
    `{全名}的青春宣言：\n{attrA}，{attrB}。\n请党放心，强国有我。`,
    `{全名}，你的名字是：\n{attrA}的传承，\n{attrB}的接力。`,
    `{全名}的奋斗格言：\n以{attrA}为舟，\n以{attrB}为桨，\n驶向星辰大海。`,
    // J类：时空对话型（续）
    `{全名}，你的名字是一艘红船，\n载着{attrA}的初心，\n驶向{attrB}的远方。\n百年恰是风华正茂。`,
    `{全名}，你听——\n{第一字}里回响着{attrA}的誓言，\n{第二字}里激荡着{attrB}的号角。\n出发，就现在。`,
    `{全名}，你的名字是{attrA}的种子，\n播撒在{attrB}的土壤。\n让信仰生根，让梦想开花。`,
    `从{第一字}到{第二字}，\n是从{attrA}到{attrB}的接力。\n{全名}，你是第几棒？`,

    // K类：对仗工整型
    `{第一字}是朝阳，{attrA}；\n{第二字}是晚霞，{attrB}。\n朝朝暮暮，皆是奋斗。`,
    `{第一字}是笔，书写{attrA}；\n{第二字}是墨，渲染{attrB}。\n{全名}，绘就人生画卷。`,
    `{第一字}为阳，{attrA}；\n{第二字}为阴，{attrB}。\n刚柔并济，方成大道。`,
    `{第一字}是帆，{attrA}；\n{第二字}是桨，{attrB}。\n乘风破浪，扬帆远航。`,

    // L类：三行微型诗
    `{全名}\n{attrA}\n{attrB}`,
    `{全名}\n{第一字}·{attrA}\n{第二字}·{attrB}`,
    `{attrA}\n{attrB}\n——{全名}`,
    `{全名}\n左肩{attrA}\n右肩{attrB}`,

    // M类：排比金句
    `是{attrA}，让{全名}不惧风雨；\n是{attrB}，让{全名}步履坚定。\n征途漫漫，惟有奋斗。`,
    `{全名}，你的{attrA}，是星火；\n你的{attrB}，是火炬。\n星火相传，照亮征程。`,
    `因为{attrA}，所以无畏；\n因为{attrB}，所以坚守。\n{全名}，这是信仰的力量。`,
    `{全名}，用{attrA}诠释初心，\n用{attrB}践行使命。\n请党放心，强国有我。`,

    // N类：谐音借义型
    `{全名}，{第一字}谐“{attrA}”，\n{第二字}通“{attrB}”。\n音义相合，信仰天成。`,
    `听，{第一字}音如{attrA}；\n品，{第二字}义似{attrB}。\n{全名}，名字即信仰。`,

    // O类：直接定义型
    `{全名}的信仰密码：\n显性基因——{attrA}\n隐性基因——{attrB}`,
    `鉴定报告：\n{全名}，你的红色基因由{attrA}和{attrB}构成，\n纯度100%。`,

    // P类：故事叙事型

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function decodeName(name) {
    let firstChar = name.charAt(0);
    let secondChar = name.charAt(1) || name.charAt(0);
    let thirdChar = name.charAt(2) || null;
    let gene1 = geneLib[secondChar] || fallbackGene;
    let gene2 = thirdChar ? (geneLib[thirdChar] || fallbackGene) : null;
    let attrA = pickRandom(gene1.attrA);
    let attrB = gene2 ? pickRandom(gene2.attrB) : pickRandom(gene1.attrB);
    let attrC = pickRandom(gene1.attrC);
    let attrD = gene2 ? pickRandom(gene2.attrD) : pickRandom(gene1.attrD);
    let template = pickRandom(poemTemplates);
    let surname = firstChar;
    let firstName = name.slice(1) || name;
    let firstWord = firstName.charAt(0);
    let secondWord = firstName.charAt(1) || firstWord;
    let poem = template
        .replace(/{姓氏}/g, surname).replace(/{全名}/g, name)
        .replace(/{第一字}/g, firstWord).replace(/{第二字}/g, secondWord)
        .replace(/{attrA}/g, attrA).replace(/{attrB}/g, attrB)
        .replace(/{attrC}/g, attrC).replace(/{attrD}/g, attrD);
    return { attrA, attrB, attrC, attrD, poem };
}
function goToPage(num) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + num).classList.add('active');
}
function startDecode() {
    let name = document.getElementById('nameInput').value.trim();
    if (!name || name.length < 2) { alert('请写下你的完整姓名（至少2个汉字）'); return; }
    goToPage(3);
    let texts = ["正在解析姓名中的信仰序列……","检测到红色基因，纯度极高……","跨越百年的精神密码，正在解锁……"];
    let idx = 0;
    let interval = setInterval(() => { idx = (idx+1)%texts.length; document.getElementById('decodingText').textContent = texts[idx]; }, 800);
    setTimeout(() => {
        clearInterval(interval);
        let res = decodeName(name);
        document.getElementById('reportName').textContent = name;
        document.getElementById('reportAttrA').textContent = res.attrA;
        document.getElementById('reportAttrB').textContent = res.attrB;
        document.getElementById('reportPoem').textContent = res.poem;
        document.getElementById('reportSeal').textContent = name;
        document.getElementById('posterPoem').textContent = res.poem;
        document.getElementById('posterSeal').textContent = name;
        goToPage(4);
    }, 2000);
}
async function exportPoster() {
    const poster = document.getElementById('posterExportArea');
    try {
        const dataUrl = await htmlToImage.toPng(poster, { quality: 1, pixelRatio: 2 });
        poster.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;border-radius:14px;" />`;
        alert('海报已生成，请长按图片保存。\n如无法保存，可使用手机截屏。');
    } catch (e) {
        console.error(e);
        alert('海报生成失败，请重试');
    }
}
document.getElementById('btnSave').addEventListener('click', exportPoster);
document.getElementById('nameInput').addEventListener('keypress', e => { if (e.key==='Enter') startDecode(); });
