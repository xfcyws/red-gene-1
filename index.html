function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function decodeName(name) {
    let firstChar = name.charAt(0);
    let secondChar = name.charAt(1) || name.charAt(0);
    let thirdChar = name.charAt(2) || null;
    let gene1 = geneLib[secondChar] || fallbackGene;
    let gene2 = thirdChar ? (geneLib[thirdChar] || fallbackGene) : null;
    let attrA = pickRandom(gene1.attrA);
    let attrB = gene2 ? pickRandom(gene2.attrB) : pickRandom(gene1.attrB);
    let attrC = pickRandom(gene1.attrC);
    let attrD = gene2 ? pickRandom(gene2.attrD) : pickRandom(gene1.attrD);
    let template = pickRandom(poemTemplates);
    let surname = firstChar;
    let firstName = name.slice(1) || name;
    let firstWord = firstName.charAt(0);
    let secondWord = firstName.charAt(1) || firstWord;
    let poem = template
        .replace(/{姓氏}/g, surname).replace(/{全名}/g, name)
        .replace(/{第一字}/g, firstWord).replace(/{第二字}/g, secondWord)
        .replace(/{attrA}/g, attrA).replace(/{attrB}/g, attrB)
        .replace(/{attrC}/g, attrC).replace(/{attrD}/g, attrD);
    return { attrA, attrB, attrC, attrD, poem };
}
function goToPage(num) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + num).classList.add('active');
}
function startDecode() {
    let name = document.getElementById('nameInput').value.trim();
    if (!name || name.length < 2) { alert('请写下你的完整姓名（至少2个汉字）'); return; }
    goToPage(3);
    let texts = ["正在解析姓名中的信仰序列……","检测到红色基因，纯度极高……","跨越百年的精神密码，正在解锁……"];
    let idx = 0;
    let interval = setInterval(() => { idx = (idx+1)%texts.length; document.getElementById('decodingText').textContent = texts[idx]; }, 800);
    setTimeout(() => {
        clearInterval(interval);
        let res = decodeName(name);
        document.getElementById('reportAttrA').textContent = res.attrA;
        document.getElementById('reportAttrB').textContent = res.attrB;
        document.getElementById('reportPoem').textContent = res.poem;
        document.getElementById('posterPoem').textContent = res.poem;
        goToPage(4);
    }, 2000);
}
async function exportPoster() {
    const poster = document.getElementById('posterExportArea');
    try {
        const dataUrl = await htmlToImage.toPng(poster, { quality: 1, pixelRatio: 2 });
        poster.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;border-radius:14px;" />`;
        alert('海报已生成，请长按图片保存。\n如无法保存，可使用手机截屏。');
    } catch (e) {
        console.error(e);
        alert('海报生成失败，请重试');
    }
}
document.getElementById('btnSave').addEventListener('click', exportPoster);
document.getElementById('nameInput').addEventListener('keypress', e => { if (e.key==='Enter') startDecode(); });
